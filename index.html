<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Seguimiento ED · EVG</title>
  <meta name="theme-color" content="#2c6c92">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Seguimiento ED">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
         background:#2c6c92;color:#fff;padding:24px}
    .card{text-align:center;max-width:400px;width:100%}
    .marco{background:#fff;border-radius:18px;padding:22px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
    .marco img{width:100%;height:auto;display:block}
    h1{font-size:22px;margin:18px 0 4px}
    p{opacity:.85;margin:0 0 22px;font-size:15px}
    a.btn{display:inline-block;background:#fff;color:#2c6c92;font-weight:700;text-decoration:none;padding:14px 26px;border-radius:12px;font-size:16px}
    .nota{font-size:12px;opacity:.7;margin-top:22px;line-height:1.5}
  </style>
</head>
<body>
  <div class="card">
    <div class="marco"><img src="logo.png" alt="Jesuitas · Fundación Loyola · Escuela Virgen de Guadalupe"></div>
    <h1>Seguimiento Equipo Directivo</h1>
    <p>Actas e INFO_CD de las reuniones</p>
    <a class="btn" id="abrir" href="#">Abrir aplicación</a>
    <div class="nota" id="nota">Acceso con tu cuenta @fundacionloyola.es</div>
  </div>
  <script>
    // ⬇️ Pega aquí la URL /exec de la implementación del Apps Script
    const APP_URL = 'https://script.google.com/a/macros/fundacionloyola.es/s/AKfycbzqfKpYFV7IlfW7SxPW6g8MYvUVsEAfu8W-gcPUvMijcDt0ZpEOXZOE46FMMAnKkxIg/exec';

    document.getElementById('abrir').href = APP_URL;
    if (APP_URL.startsWith('https://script.google.com/')) {
      // Abrir automáticamente al lanzar desde la pantalla de inicio
      setTimeout(() => { window.location.href = APP_URL; }, 400);
    } else {
      document.getElementById('nota').textContent = 'Falta configurar la URL de la aplicación en index.html';
    }
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  </script>
</body>
</html>
